name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install GNU Guile
        run: |
          sudo apt-get update
          sudo apt-get install -y guile-3.0
      - name: Compile and test
        run: make check

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and exercise container
        run: make docker-check
